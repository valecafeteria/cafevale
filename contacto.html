<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contacto | Cafetería Vale</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="top-bar">¿Tienes dudas o sugerencias? ¡Contáctanos!</div>

  <nav class="navbar">
    <div class="logo">CAFETERÍA VALE</div>
    <ul class="nav-links">
      <li><a href="index.html">Inicio</a></li>
      <li><a href="mezclas.html">Mezclas</a></li>
      <li><a href="menu.html">Menú</a></li>
      <li><a href="sucursales.html">Sucursales</a></li>
      <li><a href="contacto.html">Contacto</a></li>
    </ul>
  </nav>

  <section class="bienvenida">
    <h2>Contáctanos</h2>
    <p>Nos encantaría escuchar tu opinión o resolver tus dudas.</p>
  </section>

  <section class="formulario-contacto">
    <form action="https://formspree.io/f/tu-id-aqui" method="POST">
      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" name="nombre" required />

      <label for="correo">Correo electrónico:</label>
      <input type="email" id="correo" name="correo" required />

      <label for="mensaje">Tu mensaje u opinión:</label>
      <textarea id="mensaje" name="mensaje" rows="5" required></textarea>

      <button type="submit">Enviar</button>
    </form>
  </section>

</body>
</html>
