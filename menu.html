  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cafetería Vale - Menú Completo</title>
  <style>
    /* Reset básico */
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: 'Georgia', serif;
      background: #f5f1ea;
      color: #3b2f2f;
      display: flex;
      min-height: 100vh;
      flex-direction: column;
    }

    /* Barra de navegación */
    nav {
      background-color: #6b4f3c;
      padding: 15px 30px;
      display: flex;
      gap: 25px;
      justify-content: center;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      position: sticky;
      top: 0;
      z-index: 200;
    }
    nav a {
      color: #f7f1e7;
      text-decoration: none;
      font-weight: bold;
      font-size: 1.2rem;
      transition: color 0.3s ease;
    }
    nav a:hover {
      color: #d6b183;
    }

    /* Contenedor principal (contenido + carrito) */
    .contenedor-principal {
      flex: 1;
      display: flex;
      padding: 20px;
      gap: 20px;
      background: #f5f1ea;
    }

    /* Menú en cuadrícula */
    main.menu-productos {
      flex-grow: 1;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    /* Producto */
    .producto {
      background: #fff7f0;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transition: transform 0.2s ease;
    }
    .producto:hover {
      transform: translateY(-5px);
      box-shadow: 0 5px 12px rgba(0,0,0,0.15);
    }
    .producto img {
      width: 180px;
      height: 120px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 10px;
      box-shadow: 0 1px 5px rgba(0,0,0,0.15);
    }
    .producto h2 {
      margin: 5px 0 10px;
      color: #5c4033;
    }
    label {
      font-size: 0.9rem;
      margin-top: 8px;
      align-self: flex-start;
      color: #7b5e43;
    }
    select {
      width: 100%;
      padding: 6px;
      margin-top: 3px;
      border-radius: 5px;
      border: 1px solid #c9b59b;
      font-size: 0.95rem;
      background: #fff;
      color: #4b3b2a;
    }
    button {
      margin-top: 12px;
      padding: 8px 12px;
      background-color: #6b4f3c;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s ease;
      width: 100%;
    }
    button:hover {
      background-color: #a68259;
    }

    /* Carrito fijo a la derecha */
    #carrito-contenedor {
      width: 320px;
      max-width: 320px;
      background: #fff9f4;
      border-left: 2px solid #a07b56;
      padding: 20px;
      box-sizing: border-box;
      position: fixed;
      right: 0;
      top: 0;
      bottom: 0;
      overflow-y: auto;
      box-shadow: -4px 0 6px -3px rgba(0,0,0,0.1);
      transform: translateX(100%);
      transition: transform 0.3s ease;
      z-index: 100;
    }
    #carrito-contenedor.abierto {
      transform: translateX(0);
    }
    #carrito-toggle {
      position: fixed;
      right: 320px;
      top: 50%;
      background: #6b4f3c;
      color: white;
      padding: 10px 16px;
      border-radius: 8px 0 0 8px;
      cursor: pointer;
      font-weight: bold;
      user-select: none;
      transform: translateY(-50%);
      z-index: 101;
      box-shadow: 0 2px 5px rgba(0,0,0,0.15);
      transition: background-color 0.3s ease;
    }
    #carrito-toggle:hover {
      background-color: #a68259;
    }
    /* Estilo carrito contenido */
    #carrito-contenedor h3 {
      margin-top: 0;
      font-family: 'Georgia', serif;
      color: #5c4033;
      text-align: center;
    }
    #carrito-contenedor ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    #carrito-contenedor ul li {
      padding: 8px 0;
      border-bottom: 1px solid #d9cbbf;
      display: flex;
      justify-content: space-between;
      font-size: 0.95rem;
      align-items: center;
    }
    #carrito-contenedor ul li span {
      font-weight: 600;
    }
    #carrito-contenedor ul li button {
      background: none;
      border: none;
      color: #a0522d;
      cursor: pointer;
      font-weight: bold;
      font-size: 1.1rem;
      padding: 0 5px;
      line-height: 1;
    }
    #carrito-contenedor button.vaciar-carrito {
      background: #b35a5a;
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      border-radius: 6px;
      border: none;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    #carrito-contenedor button.vaciar-carrito:hover {
      background: #d16e6e;
    }
  </style>
</head>
