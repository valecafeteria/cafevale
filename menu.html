<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Menú | Cafetería Vale</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/script.js" defer></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0; padding: 0;
      display: flex;
      min-height: 100vh;
      background: #f5f1ea;
      color: #3b2f2f;
    }
    main.menu-productos {
      display: grid;
      grid-template-columns: repeat(auto-fill,minmax(280px,1fr));
      gap: 20px;
      padding: 20px;
      flex-grow: 1;
      box-sizing: border-box;
    }
    .producto {
      background: #fff7f0;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .producto img {
      width: 180px;
      height: 120px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 10px;
      box-shadow: 0 1px 5px rgba(0,0,0,0.15);
    }
    .producto h2 {
      margin: 5px 0 10px;
      font-family: 'Georgia', serif;
      font-weight: normal;
      color: #5c4033;
    }
    label {
      font-size: 0.9rem;
      margin-top: 8px;
      align-self: flex-start;
      color: #7b5e43;
    }
    select {
      width: 100%;
      padding: 6px;
      margin-top: 3px;
      border-radius: 5px;
      border: 1px solid #c9b59b;
      font-size: 0.95rem;
      background: #fff;
      color: #4b3b2a;
    }
    button {
      margin-top: 12px;
      padding: 8px 12px;
      background-color: #6b4f3c;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    button:hover {
      background-color: #a68259;
    }

    /* Carrito fijo a la derecha */
    #carrito-contenedor {
      width: 320px;
      max-width: 320px;
      background: #fff9f4;
      border-left: 2px solid #a07b56;
      padding: 20px;
      box-sizing: border-box;
      position: fixed;
      right: 0;
      top: 0;
      bottom: 0;
      overflow-y: auto;
      box-shadow: -4px 0 6px -3px rgba(0,0,0,0.1);
      transform: translateX(100%);
      transition: transform 0.3s ease;
      z-index: 100;
    }
    #carrito-contenedor.abierto {
      transform: translateX(0);
    }
    #carrito-toggle {
      position: fixed;
      right: 320px;
      top: 50%;
      background: #6b4f3c;
      color: white;
      padding: 10px 16px;
      border-radius: 8px 0 0 8px;
      cursor: pointer;
      font-weight: bold;
      user-select: none;
      transform: translateY(-50%);
      z-index: 101;
      box-shadow: 0 2px 5px rgba(0,0,0,0.15);
      transition: background-color 0.3s ease;
    }
    #carrito-toggle:hover {
      background-color: #a68259;
    }
    /* Estilo carrito contenido */
    #carrito-contenedor h3 {
      margin-top: 0;
      font-family: 'Georgia', serif;
      color: #5c4033;
      text-align: center;
    }
    #carrito-contenedor ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    #carrito-contenedor ul li {
      padding: 8px 0;
      border-bottom: 1px solid #d9cbbf;
      display: flex;
      justify-content: space-between;
      font-size: 0.95rem;
    }
    #carrito-contenedor ul li span {
      font-weight: 600;
    }
    #carrito-contenedor button.vaciar-carrito {
      background: #b35a5a;
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      border-radius: 6px;
      border: none;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    #carrito-contenedor button.vaciar-carrito:hover {
      background: #d16e6e;
    }
  </style>
</head>
<body>

  <main class="menu-productos">

    <!-- Ejemplo con imágenes, cambia las rutas a tus imágenes -->
    <div class="producto">
      <img src="img/latte.jpg" alt="Latte" />
      <h2>Latte</h2>
      <label for="tamano-latte">Tamaño:</label>
      <select id="tamano-latte">
        <option value="45">Chico $45</option>
        <option value="50">Mediano $50</option>
        <option value="55">Grande $55</option>
      </select>
      <label for="leche-latte">Tipo de leche:</label>
      <select id="leche-latte">
        <option value="Entera">Entera</option>
        <option value="Deslactosada">Deslactosada</option>
        <option value="Avena">Avena</option>
        <option value="Almendra">Almendra</option>
      </select>
      <label for="extra-latte">Complemento:</label>
      <select id="extra-latte">
        <option value="Ninguno">Ninguno</option>
        <option value="Chispas de chocolate">Chispas de chocolate</option>
        <option value="Jarabe de vainilla">Jarabe de vainilla</option>
        <option value="Canela">Canela</option>
      </select>
      <button onclick="agregarProductoPersonalizado('Latte')">Agregar al carrito</button>
    </div>

    <div class="producto">
      <img src="img/capuchino.jpg" alt="Capuchino" />
      <h2>Capuchino</h2>
      <label for="tamano-capuchino">Tamaño:</label>
      <select id="tamano-capuchino">
        <option value="45">Chico $45</option>
        <option value="50">Mediano $50</option>
        <option value="55">Grande $55</option>
      </select>
      <label for="leche-capuchino">Tipo de leche:</label>
      <select id="leche-capuchino">
        <option value="Entera">Entera</option>
        <option value="Deslactosada">Deslactosada</option>
        <option value="Avena">Avena</option>
        <option value="Almendra">Almendra</option>
      </select>
      <label for="extra-capuchino">Complemento:</label>
      <select id="extra-capuchino">
        <option value="Ninguno">Ninguno</option>
        <option value="Chispas de chocolate">Chispas de chocolate</option>
        <option value="Jarabe de vainilla">Jarabe de vainilla</option>
        <option value="Canela">Canela</option>
      </select>
      <button onclick="agregarProductoPersonalizado('Capuchino')">Agregar al carrito</button>
    </div>

    <div class="producto">
      <img src="img/espresso.jpg" alt="Espresso Americano" />
      <h2>Espresso Americano</h2>
      <label for="tamano-espresso">Tamaño:</label>
      <select id="tamano-espresso">
        <option value="40">Chico $40</option>
        <option value="45">Mediano $45</option>
        <option value="50">Grande $50</option>
      </select>
      <label for="leche-espresso">Tipo de leche:</label>
      <select id="leche-espresso">
        <option value="Entera">Entera</option>
        <option value="Deslactosada">Deslactosada</option>
        <option value="Avena">Avena</option>
        <option value="Almendra">Almendra</option>
      </select>
      <label for="extra-espresso">Complemento:</label>
      <select id="extra-espresso">
        <option value="Ninguno">Ninguno</option>
        <option value="Chispas de chocolate">Chispas de chocolate</option>
        <option value="Jarabe de vainilla">Jarabe de vainilla</option>
        <option value="Canela">Canela</option>
      </select>
      <button onclick="agregarProductoPersonalizado('Espresso Americano')">Agregar al carrito</button>
    </div>

    <!-- Repite para los demás productos (Moka, Vainilla, Caramelo, Café Helado, Frappé, Chai Latte, Sándwich, Croissant) -->
    <!-- Solo un ejemplo más para no hacer muy largo el mensaje -->

    <div class="producto">
      <img src="img/moka.jpg" alt="Moka" />
      <h2>Moka</h2>
      <label for="tamano-moka">Tamaño:</label>
      <select id="tamano-moka">
        <option value="48">Chico $48</option>
        <option value="53">Mediano $53</option>
        <option value="58">Grande $58</option>
      </select>
      <label for="leche-moka">Tipo de leche:</label>
      <select id="leche-moka">
        <option value="Entera">Entera</option>
        <option value="Deslactosada">Deslactosada</option>
        <option value="Avena">Avena</option>
        <option value="Almendra">Almendra</option>
      </select>
      <label for="extra-moka">Complemento:</label>
      <select id="extra-moka">
        <option value="Ninguno">Ninguno</option>
        <option value="Chispas de chocolate">Chispas de chocolate</option>
        <option value="Jarabe de vainilla">Jarabe de vainilla</option>
        <option value="Canela">Canela</option>
      </select>
      <button onclick="agregarProductoPersonalizado('Moka')">Agregar al carrito</button>
    </div>

  </main>

  <div id="carrito-toggle">Carrito 🛒</div>

  <aside id="carrito-contenedor">
    <h3>Tu carrito</h3>
    <ul id="lista-carrito"></ul>
    <button class="vaciar-carrito" onclick="vaciarCarrito()">Vaciar carrito</button>
  </aside>

  <script>
    const carritoToggle = document.getElementById('carrito-toggle');
    const carritoContenedor = document.getElementById('carrito-contenedor');
    const listaCarrito = document.getElementById('lista-carrito');

    let carrito = [];

    carritoToggle.addEventListener('click', () => {
      carritoContenedor.classList.toggle('abierto');
    });

    function agregarProductoPersonalizado(nombre) {
      // Obtener selects relacionados con ese producto
      const tamano = document.getElementById(`tamano-${nombre.toLowerCase().replace(/ /g, '-')}`);
      const leche = document.getElementById(`leche-${nombre.toLowerCase().replace(/ /g, '-')}`);
      const extra = document.getElementById(`extra-${nombre.toLowerCase().replace(/ /g, '-')}`);

      if(!tamano || !leche || !extra) {
        alert('Error al obtener opciones del producto.');
        return;
      }

      const precio = parseFloat(tamano.value);
      const producto = {
        nombre,
        tamano: tamano.options[tamano.selectedIndex].text,
        leche: leche.value,
        extra: extra.value,
        precio
      };

      carrito.push(producto);
      actualizarCarrito();
      alert(`${nombre} agregado al carrito.`);
    }

    function actualizarCarrito() {
      listaCarrito.innerHTML = '';
      let total = 0;

      carrito.forEach((prod, index) => {
        total += prod.precio;
        const li = document.createElement('li');
        li.innerHTML = `
          <span>${prod.nombre} (${prod.tamano})</span>
          <span>$${prod.precio.toFixed(2)}</span>
          <button onclick="eliminarProducto(${index})" style="background:none;border:none;color:#a0522d;cursor:pointer;">x</button>
          <br>
          <small>Leche: ${prod.leche}, Extra: ${prod.extra}</small>
        `;
        listaCarrito.appendChild(li);
      });

      const liTotal = document.createElement('li');
      liTotal.style.fontWeight = 'bold';
      liTotal.style.marginTop = '10px';
      liTotal.innerText = `Total: $${total.toFixed(2)}`;
      listaCarrito.appendChild(liTotal);
    }

    function eliminarProducto(index) {
      carrito.splice(index, 1);
      actualizarCarrito();
    }

    function vaciarCarrito() {
      carrito = [];
      actualizarCarrito();
    }
  </script>
</body>
</html>
